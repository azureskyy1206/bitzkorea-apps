services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-idb07974}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - school_mysqldata:/var/lib/mysql
      - ./idb07974_20260707.sql:/docker-entrypoint-initdb.d/01-import.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      CI_ENVIRONMENT: production
    ports:
      - "127.0.0.1:${WEB_PORT:-8020}:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  school_mysqldata:
