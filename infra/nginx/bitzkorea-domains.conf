# ITC Sales Support + Adobe School Portal — Host 기반 라우팅
# 배포: sudo cp /home/azureuser/infra/nginx/bitzkorea-domains.conf /etc/nginx/sites-available/bitzkorea-domains.conf
#       sudo ln -sf /etc/nginx/sites-available/bitzkorea-domains.conf /etc/nginx/sites-enabled/bitzkorea-domains.conf
#       sudo rm -f /etc/nginx/sites-enabled/sales-support-web
#       sudo nginx -t && sudo systemctl reload nginx
#
# TLS: sudo certbot --nginx -d itc.bitzkorea.com -d adobe.bitzkorea.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS (도메인별 Host 유지)
server {
    listen 80;
    listen [::]:80;
    server_name itc.bitzkorea.com adobe.bitzkorea.com;
    return 301 https://$host$request_uri;
}

# ── ITC 영업관리 (Sales Support) ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itc.bitzkorea.com;

    include snippets/snakeoil.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ── Adobe School Portal ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adobe.bitzkorea.com;

    include snippets/snakeoil.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    # 학교 포털 REST API (FastAPI 8010) — Next 페이지 /audit 와 경로 분리
    location /backend-api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Next.js (3010): UI + /api/admin/* 프록시
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
