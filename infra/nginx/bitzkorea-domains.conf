# Adobe School Portal — Host 기반 라우팅
# 배포: sudo cp /home/azureuser/infra/nginx/bitzkorea-domains.conf /etc/nginx/sites-available/bitzkorea-domains.conf
#       sudo ln -sf /etc/nginx/sites-available/bitzkorea-domains.conf /etc/nginx/sites-enabled/bitzkorea-domains.conf
#       sudo rm -f /etc/nginx/sites-enabled/sales-support-web
#       sudo nginx -t && sudo systemctl reload nginx
#
# TLS: ~/2026_star.bitzkorea.com/NginX_pem → /etc/ssl/bitzkorea/ + snippets/bitzkorea-ssl.conf
#       (scripts/apply-bitzkorea-ssl.sh 참고)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS (도메인별 Host 유지)
server {
    listen 80;
    listen [::]:80;
    server_name adobe.bitzkorea.com school.bitzkorea.com;
    return 301 https://$host$request_uri;
}

# ── Adobe School Portal ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adobe.bitzkorea.com;

    include snippets/bitzkorea-ssl.conf;

    client_max_body_size 100m;

    # 학교 포털 REST API (FastAPI 8010) — Next 페이지 /audit 와 경로 분리
    location /backend-api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Next.js (3010): UI + /api/admin/* 프록시
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ── School 공동구매 (CodeIgniter 4 / PHP Apache Docker :8020) ─────────────
# adobe 와 동일: Host 기반 라우팅 + *.bitzkorea.com 와일드카드 SSL
# (Tomcat 아님 — PHP 8.2 Apache 컨테이너)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.bitzkorea.com;

    include snippets/bitzkorea-ssl.conf;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
    }
}
