# *.bitzkorea.com (업로드: ~/2026_star.bitzkorea.com/NginX_pem/)
# 배포: sudo cp ... /etc/nginx/snippets/bitzkorea-ssl.conf
ssl_certificate     /etc/ssl/bitzkorea/star.bitzkorea.com.pem;
ssl_certificate_key   /etc/ssl/bitzkorea/star.bitzkorea.com.pem.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
