# 업로드 파일명은 날짜(YYYYMMDD)만 추출하면 되므로, "_수정" 같은 복사본 접미사도 허용
# 예: 대외비_..._20260430.xlsx, 대외비_..._20260430_수정.xlsx
file_pattern: '_(\d{8})(?:_[^.]*)?\.xlsx$'
current_fiscal_sheet: "2026"
header_row: 11
data_start_row: 12

data_end_rule:
  any_null: ["매입예상월", "담당자"]

composite_key:
  - 담당자
  - Vendor
  - 매출처명
  - 수요기관명
  - Program
  - 제품명(가격표기준)
  - 매출완료월
  - 매입예상월
  - 매출유형

fallback_key:
  - 담당자
  - Vendor
  - 매출처명
  - 수요기관명
  - Program
  - 제품명(가격표기준)
  - 매입예상월
  - 매출유형

column_priority:
  high:
    - 매출수량
    - 매출단가
    - 매출금액
    - 매입수량
    - 매입단가
    - 매입금액
    - 이익액
    - 이익률
    - 진행률
  medium:
    - 매출완료월
    - 매출유형
    - 매입변경월
    - "계산서\n매입월일"
    - "계산서\n매출월일"
  low:
    - "영업 진행내용(날짜/내용 순으로 기재)"
    - "(구)담당자"
