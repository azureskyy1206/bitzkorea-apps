services:
  postgres:
    image: postgres:16
    container_name: sales-postgres
    restart: always
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales_dev_pw_change_me
      POSTGRES_DB: sales_tracker
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sales-redis
    restart: always
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  ollama:
    image: ollama/ollama:latest
    container_name: sales-ollama
    restart: always
    environment:
      TZ: Asia/Seoul
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  ollamadata:
